<svg xmlns="http://www.w3.org/2000/svg" width="120" height="200" viewBox="0 0 120 200">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A7410"/>
      <stop offset="0.5" stop-color="#F2C84B"/>
      <stop offset="1" stop-color="#9A7410"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070605"/>
      <stop offset="0.5" stop-color="#23211c"/>
      <stop offset="1" stop-color="#070605"/>
    </linearGradient>
    <linearGradient id="tyre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050403"/>
      <stop offset="0.5" stop-color="#221f1a"/>
      <stop offset="1" stop-color="#050403"/>
    </linearGradient>
    <radialGradient id="rain" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ff7a7a"/><stop offset="0.55" stop-color="#ff2630"/><stop offset="1" stop-color="#7a0d12"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="60" cy="102" rx="50" ry="92" fill="#000" opacity="0.22"/>

  <!-- suspension arms (under wheels/body) -->
  <g stroke="#6b540e" stroke-width="2.4" opacity="0.9">
    <line x1="46" y1="42" x2="24" y2="38"/><line x1="46" y1="52" x2="24" y2="56"/>
    <line x1="74" y1="42" x2="96" y2="38"/><line x1="74" y1="52" x2="96" y2="56"/>
    <line x1="44" y1="156" x2="20" y2="152"/><line x1="44" y1="168" x2="20" y2="172"/>
    <line x1="76" y1="156" x2="100" y2="152"/><line x1="76" y1="168" x2="100" y2="172"/>
  </g>

  <!-- wheels -->
  <g stroke="#332f27" stroke-width="1.4">
    <rect x="9"  y="30"  width="17" height="34" rx="5" fill="url(#tyre)"/>
    <rect x="94" y="30"  width="17" height="34" rx="5" fill="url(#tyre)"/>
    <rect x="5"  y="146" width="19" height="39" rx="6" fill="url(#tyre)"/>
    <rect x="96" y="146" width="19" height="39" rx="6" fill="url(#tyre)"/>
  </g>
  <g stroke="#403a30" stroke-width="1" opacity="0.7">
    <line x1="13" y1="40" x2="22" y2="40"/><line x1="13" y1="48" x2="22" y2="48"/><line x1="13" y1="56" x2="22" y2="56"/>
    <line x1="98" y1="40" x2="107" y2="40"/><line x1="98" y1="48" x2="107" y2="48"/><line x1="98" y1="56" x2="107" y2="56"/>
    <line x1="9" y1="158" x2="20" y2="158"/><line x1="9" y1="166" x2="20" y2="166"/><line x1="9" y1="174" x2="20" y2="174"/>
    <line x1="100" y1="158" x2="111" y2="158"/><line x1="100" y1="166" x2="111" y2="166"/><line x1="100" y1="174" x2="111" y2="174"/>
  </g>

  <!-- front wing -->
  <rect x="10" y="8"  width="100" height="8" rx="2" fill="url(#gold)" stroke="#6b540e" stroke-width="1"/>
  <rect x="14" y="15" width="92"  height="3" rx="1.5" fill="#8a6b12"/>
  <rect x="7"  y="4"  width="6"   height="18" rx="2" fill="#15130f" stroke="#D4A017" stroke-width="1.4"/>
  <rect x="107" y="4" width="6"   height="18" rx="2" fill="#15130f" stroke="#D4A017" stroke-width="1.4"/>

  <!-- nose cone -->
  <polygon points="52,18 68,18 77,62 43,62" fill="url(#gold)" stroke="#6b540e" stroke-width="1"/>
  <polygon points="56,22 64,22 61,60 59,60" fill="#0b0a08" opacity="0.45"/>
  <circle cx="60" cy="40" r="7" fill="#0b0a08"/>
  <text x="60" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#D4A017">Z</text>

  <!-- monocoque tub -->
  <rect x="43" y="56" width="34" height="96" rx="12" fill="url(#body)" stroke="#D4A017" stroke-width="1.6"/>

  <!-- sidepods -->
  <rect x="22" y="84" width="23" height="48" rx="8" fill="url(#body)" stroke="#6b540e" stroke-width="1"/>
  <rect x="75" y="84" width="23" height="48" rx="8" fill="url(#body)" stroke="#6b540e" stroke-width="1"/>
  <rect x="25" y="87" width="17" height="7" rx="2" fill="#D4A017" opacity="0.85"/>
  <rect x="78" y="87" width="17" height="7" rx="2" fill="#D4A017" opacity="0.85"/>

  <!-- livery centre stripe -->
  <rect x="57" y="56" width="6" height="98" fill="#D4A017" opacity="0.9"/>

  <!-- airbox scoop (behind driver) -->
  <polygon points="54,126 66,126 71,144 49,144" fill="#15130f" stroke="#9A7410" stroke-width="1.2"/>

  <!-- halo -->
  <rect x="48" y="95" width="24" height="32" rx="12" fill="none" stroke="#D4A017" stroke-width="3"/>
  <rect x="58" y="118" width="4" height="10" fill="#D4A017"/>

  <!-- cockpit + driver -->
  <rect x="51" y="94" width="18" height="32" rx="9" fill="#070605"/>
  <circle cx="60" cy="110" r="8" fill="#e8e0d0"/>
  <rect x="56" y="105" width="8" height="4" rx="2" fill="#D4A017"/>
  <path d="M53 110 a7 7 0 0 1 14 0 z" fill="#0b0a08" opacity="0.85"/>

  <!-- rear rain light -->
  <rect x="55" y="160" width="10" height="7" rx="2" fill="url(#rain)"/>

  <!-- rear wing -->
  <rect x="12" y="184" width="96" height="8" rx="2" fill="url(#gold)" stroke="#6b540e" stroke-width="1"/>
  <rect x="20" y="193" width="80" height="3" rx="1.5" fill="#8a6b12"/>
  <rect x="9"  y="180" width="6" height="18" rx="2" fill="#15130f" stroke="#D4A017" stroke-width="1.4"/>
  <rect x="105" y="180" width="6" height="18" rx="2" fill="#15130f" stroke="#D4A017" stroke-width="1.4"/>
  <text x="60" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" font-weight="700" letter-spacing="1.5" fill="#0b0a08">ZUURA</text>
</svg>
